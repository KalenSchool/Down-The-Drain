<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hydro-Math: Water Level Challenge</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Tone.js for Sound Effects -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Quicksand:wght@500;700&display=swap');

        body {
            font-family: 'Quicksand', sans-serif;
            background: linear-gradient(135deg, #090d16 0%, #111827 50%, #090d16 100%);
            min-height: 100vh;
            color: #f8fafc;
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 0.5rem;
        }

        .font-display {
            font-family: 'Fredoka', cursive;
        }

        .glass-panel {
            background: rgba(30, 41, 59, 0.95);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        #svg-water-rect {
            transition: height 0.6s cubic-bezier(0.4, 0, 0.2, 1), y 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        #svg-goal-group {
            transition: transform 0.3s ease-out;
        }
    </style>
</head>
<body class="select-none">

    <!-- Main Container - Immersive, bold, and fully visible on one screen -->
    <div class="w-full max-w-2xl flex flex-col gap-3 my-auto">

        <!-- Header & Streak Counter -->
        <header class="w-full flex flex-row justify-between items-center px-1">
            <div class="flex items-center gap-3">
                <div class="p-2.5 bg-cyan-500/20 rounded-2xl border border-cyan-500/40 text-cyan-400 shadow-xl">
                    <i data-lucide="waves" class="w-7 h-7"></i>
                </div>
                <div>
                    <h1 class="font-display text-2xl font-bold tracking-wide text-white leading-tight">
                        Down The Drain <span class="text-xs font-sans uppercase px-2.5 py-0.5 rounded-full bg-cyan-500/20 text-cyan-300 border border-cyan-500/30">Puzzle</span>
                    </h1>
                    <p class="text-xs text-cyan-200/80 font-medium">Get 3 correct answers in a row</p>
                </div>
            </div>

            <!-- Stats Bar -->
            <div class="flex items-center gap-3 bg-slate-800/95 px-4 py-2 rounded-2xl border border-slate-700 shadow-xl">
                <div class="text-center">
                    <span class="text-[10px] text-slate-400 uppercase font-bold block tracking-wider">Streak</span>
                    <span id="streak-val" class="font-display text-lg font-bold text-amber-400 leading-none">0</span>
                </div>
                <button id="audio-toggle" title="Toggle Sound" class="p-2 ml-1 rounded-xl bg-slate-700/60 hover:bg-slate-700 text-slate-300 hover:text-white transition shadow">
                    <i id="audio-icon" data-lucide="volume-2" class="w-5 h-5"></i>
                </button>
            </div>
        </header>

        <!-- Main Workspace Grid -->
        <main class="w-full grid grid-cols-1 md:grid-cols-2 gap-3 items-stretch">

            <!-- Water Tank Column -->
            <div class="glass-panel p-5 rounded-3xl flex flex-col items-center justify-between shadow-2xl relative">
                
                <!-- Target / Current Status Badge -->
                <div class="w-full bg-slate-900/95 border border-slate-700/80 rounded-2xl px-5 py-2.5 flex justify-between items-center shadow-inner">
                    <div class="flex items-center gap-2">
                        <span class="uppercase text-slate-400 font-bold text-xs">Goal:</span>
                        <span id="target-display" class="font-display text-xl text-amber-400 font-bold">5</span>
                    </div>
                    <div class="flex items-center gap-2">
                        <span class="uppercase text-slate-400 font-bold text-xs">Current:</span>
                        <span id="current-display" class="font-display text-xl text-cyan-400 font-bold">8</span>
                    </div>
                </div>

                <!-- SVG Water Tank Area -->
                <div class="relative w-full max-w-[210px] h-[280px] my-2 flex items-center justify-center">
                    <svg viewBox="0 0 120 115" class="w-full h-full drop-shadow-2xl overflow-visible">
                        <defs>
                            <linearGradient id="waterGradient" x1="0" y1="0" x2="0" y2="1">
                                <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.95"/>
                                <stop offset="50%" stop-color="#0284c7" stop-opacity="0.95"/>
                                <stop offset="100%" stop-color="#0369a1" stop-opacity="0.98"/>
                            </linearGradient>
                            <filter id="glow">
                                <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
                                <feMerge>
                                    <feMergeNode in="coloredBlur"/>
                                    <feMergeNode in="SourceGraphic"/>
                                </feMerge>
                            </filter>
                        </defs>

                        <!-- Tank Container Outer Glass -->
                        <rect x="25" y="5" width="70" height="90" rx="4" fill="rgba(15, 23, 42, 0.6)" stroke="rgba(255, 255, 255, 0.35)" stroke-width="2.5" />

                        <!-- Liquid Water Rectangle -->
                        <rect id="svg-water-rect" x="26.5" y="23" width="67" height="71" rx="2" fill="url(#waterGradient)" />
                        
                        <!-- Water Top Surface Highlight -->
                        <line id="svg-water-surface" x1="26.5" y1="23" x2="93.5" y2="23" stroke="#f0f9ff" stroke-width="1.5" opacity="0.9"/>

                        <!-- Measurement Ticks -->
                        <g id="svg-scale-ticks"></g>

                        <!-- Goal Indicator -->
                        <g id="svg-goal-group" filter="url(#glow)">
                            <line x1="22" y1="50" x2="98" y2="50" stroke="#fbbf24" stroke-width="2.2" stroke-dasharray="3,2" />
                            <rect x="98" y="43" width="24" height="14" rx="3" fill="#fbbf24" />
                            <text x="110" y="51" fill="#0f172a" font-size="5.5" font-weight="bold" font-family="Fredoka, sans-serif" text-anchor="middle" dominant-baseline="middle">GOAL</text>
                        </g>

                        <!-- Drain Pipe, Valve Handle & Connected Stream Inside SVG -->
                        <g id="svg-drain-assembly">
                            <rect x="54" y="95" width="12" height="4.5" fill="#475569" stroke="#334155" stroke-width="0.5" />
                            <!-- Falling Water Stream positioned directly at pipe mouth (y=99.5) -->
                            <rect id="svg-water-stream" x="56" y="99.5" width="8" height="0" rx="2" fill="url(#waterGradient)" opacity="0" />
                            <rect id="svg-valve-handle" x="50" y="95.5" width="20" height="3.5" rx="1.5" fill="#ef4444" stroke="#991b1b" stroke-width="0.5" class="cursor-pointer transition-transform duration-300 origin-center" style="transform-box: fill-box; transform-origin: center;" />
                        </g>
                    </svg>
                </div>

                <div class="text-sm text-slate-300 text-center font-semibold tracking-wide">
                    Match target goal line exactly.
                </div>
            </div>

            <!-- Controls Column -->
            <div class="glass-panel p-5 rounded-3xl flex flex-col justify-between shadow-2xl">
                <div>
                    <h2 class="font-display text-lg font-bold text-white mb-1">Drain Controls</h2>
                    <p class="text-xs text-slate-300 leading-tight">Choose how much water to drain</p>
                </div>

                <!-- Stepper & Drain Button Container -->
                <div class="bg-slate-900/95 border border-slate-700/80 rounded-2xl p-4 text-center shadow-inner flex flex-col items-center justify-center gap-3.5 my-2">
                    
                    <div class="flex items-center justify-center gap-4 w-full">
                        <button id="dec-btn" aria-label="Decrease drain amount" class="w-14 h-14 rounded-2xl bg-slate-800 border border-slate-700 text-slate-200 hover:bg-slate-700 active:scale-90 transition flex items-center justify-center shadow-lg">
                            <i data-lucide="minus" class="w-6 h-6"></i>
                        </button>

                        <div id="selected-drain-display" class="font-display text-4xl font-bold text-amber-400 bg-amber-400/10 border border-amber-400/30 rounded-2xl w-20 h-16 flex items-center justify-center shadow-inner">
                            1
                        </div>

                        <button id="inc-btn" aria-label="Increase drain amount" class="w-14 h-14 rounded-2xl bg-slate-800 border border-slate-700 text-slate-200 hover:bg-slate-700 active:scale-90 transition flex items-center justify-center shadow-lg">
                            <i data-lucide="plus" class="w-6 h-6"></i>
                        </button>
                    </div>

                    <!-- Drain Water Button moved up directly below amount controls -->
                    <div class="w-full pt-1">
                        <button id="drain-btn" class="w-full py-3.5 rounded-2xl bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 disabled:from-slate-700 disabled:to-slate-800 disabled:text-slate-500 disabled:cursor-not-allowed font-display text-base font-bold text-white shadow-xl shadow-cyan-500/30 active:scale-[0.98] transition flex items-center justify-center gap-2.5">
                            <i data-lucide="droplet" class="w-5 h-5"></i> DRAIN WATER
                        </button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Result Modal Overlay -->
    <div id="result-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-4 z-50 opacity-0 pointer-events-none transition-opacity duration-300">
        <div id="modal-card" class="glass-panel w-full max-w-sm p-6 rounded-3xl border border-slate-700 text-center transform scale-90 transition-transform duration-300 shadow-2xl flex flex-col items-center">
            
            <div id="modal-icon-container" class="w-16 h-16 rounded-full flex items-center justify-center mb-3 text-white"></div>

            <h3 id="modal-title" class="font-display text-xl font-bold mb-1 text-white">Great Job!</h3>
            <p id="modal-desc" class="text-slate-200 mb-6 text-sm">You drained units and hit the target!</p>

            <button id="modal-next-btn" class="w-full py-3.5 rounded-2xl font-display text-sm font-bold text-white shadow-lg transition active:scale-95 flex items-center justify-center gap-2">
                Next Level <i data-lucide="arrow-right" class="w-5 h-5"></i>
            </button>
        </div>
    </div>

    <!-- JavaScript Game Logic -->
    <script>
        let audioEnabled = true;
        const synth = new Tone.Synth().toDestination();
        synth.volume.value = -10;

        function playSound(type) {
            if (!audioEnabled) return;
            try {
                Tone.start();
                const now = Tone.now();
                if (type === 'select') {
                    synth.triggerAttackRelease("C5", "8n", now);
                } else if (type === 'drain') {
                    const noise = new Tone.NoiseSynth({
                        envelope: { attack: 0.01, decay: 0.3, sustain: 0 }
                    }).toDestination();
                    noise.volume.value = -12;
                    noise.triggerAttackRelease("16n");
                } else if (type === 'win') {
                    synth.triggerAttackRelease("C4", "8n", now);
                    synth.triggerAttackRelease("E4", "8n", now + 0.1);
                    synth.triggerAttackRelease("G4", "8n", now + 0.2);
                    synth.triggerAttackRelease("C5", "4n", now + 0.3);
                } else if (type === 'lose') {
                    synth.triggerAttackRelease("F4", "8n", now);
                    synth.triggerAttackRelease("Eb4", "8n", now + 0.15);
                    synth.triggerAttackRelease("D4", "4n", now + 0.3);
                }
            } catch (e) {
                console.log("Audio play error:", e);
            }
        }

        const TANK_BOTTOM_Y = 95;
        const UNIT_HEIGHT = 9;

        function levelToY(level) {
            return TANK_BOTTOM_Y - (level * UNIT_HEIGHT);
        }

        let currentWater = 8;
        let targetWater = 5;
        let selectedDrain = 1;
        let streak = 0;
        let isAnimating = false;

        const currentDisplay = document.getElementById('current-display');
        const targetDisplay = document.getElementById('target-display');
        const svgWaterRect = document.getElementById('svg-water-rect');
        const svgWaterSurface = document.getElementById('svg-water-surface');
        const svgGoalGroup = document.getElementById('svg-goal-group');
        const svgScaleTicks = document.getElementById('svg-scale-ticks');

        const decBtn = document.getElementById('dec-btn');
        const incBtn = document.getElementById('inc-btn');
        const selectedDrainDisplay = document.getElementById('selected-drain-display');

        const drainBtn = document.getElementById('drain-btn');
        const svgValveHandle = document.getElementById('svg-valve-handle');
        const svgWaterStream = document.getElementById('svg-water-stream');

        const streakVal = document.getElementById('streak-val');
        const audioToggle = document.getElementById('audio-toggle');
        const audioIcon = document.getElementById('audio-icon');

        const resultModal = document.getElementById('result-modal');
        const modalCard = document.getElementById('modal-card');
        const modalIconContainer = document.getElementById('modal-icon-container');
        const modalTitle = document.getElementById('modal-title');
        const modalDesc = document.getElementById('modal-desc');
        const modalNextBtn = document.getElementById('modal-next-btn');

        function initSvgScale() {
            let svgMarkup = '';
            for (let i = 1; i <= 10; i++) {
                const yPos = levelToY(i);
                svgMarkup += `
                    <line x1="20" y1="${yPos}" x2="25" y2="${yPos}" stroke="#94a3b8" stroke-width="1.5" />
                    <line x1="95" y1="${yPos}" x2="100" y2="${yPos}" stroke="#94a3b8" stroke-width="1.5" />
                    <text x="14" y="${yPos}" fill="#f59e0b" font-size="6" font-weight="bold" font-family="Fredoka, sans-serif" text-anchor="middle" dominant-baseline="middle">${i}</text>
                `;
            }
            svgScaleTicks.innerHTML = svgMarkup;
        }

        function renderSvgVisuals(waterLvl, targetLvl) {
            const waterY = levelToY(waterLvl);
            const waterH = waterLvl * UNIT_HEIGHT;

            svgWaterRect.setAttribute('y', waterY);
            svgWaterRect.setAttribute('height', waterH);

            svgWaterSurface.setAttribute('y1', waterY);
            svgWaterSurface.setAttribute('y2', waterY);

            const goalY = levelToY(targetLvl);
            svgGoalGroup.style.transform = `translateY(${goalY - 50}px)`;
        }

        function updateStepperDisplay() {
            selectedDrainDisplay.innerText = selectedDrain;
            playSound('select');
        }

        function adjustDrainAmount(delta) {
            if (isAnimating) return;
            const newAmount = selectedDrain + delta;
            if (newAmount >= 1 && newAmount <= 10) {
                selectedDrain = newAmount;
                updateStepperDisplay();
            }
        }

        function newGame() {
            if (isAnimating) return;
            currentWater = Math.floor(Math.random() * 9) + 2; 
            targetWater = Math.floor(Math.random() * (currentWater - 1)) + 1;

            selectedDrain = 1;
            selectedDrainDisplay.innerText = selectedDrain;

            currentDisplay.innerText = currentWater;
            targetDisplay.innerText = targetWater;

            drainBtn.disabled = false;
            renderSvgVisuals(currentWater, targetWater);
        }

        function drainWater() {
            if (selectedDrain === null || isAnimating) return;

            isAnimating = true;
            drainBtn.disabled = true;

            const finalWater = Math.max(0, currentWater - selectedDrain);

            svgValveHandle.style.transform = 'rotate(90deg)';
            svgWaterStream.setAttribute('height', '18');
            svgWaterStream.setAttribute('opacity', '1');
            playSound('drain');

            setTimeout(() => {
                renderSvgVisuals(finalWater, targetWater);
                currentDisplay.innerText = finalWater;
            }, 100);

            setTimeout(() => {
                svgValveHandle.style.transform = 'rotate(0deg)';
                svgWaterStream.setAttribute('height', '0');
                svgWaterStream.setAttribute('opacity', '0');

                const isSuccess = (finalWater === targetWater);
                showResult(isSuccess, finalWater);

                isAnimating = false;
            }, 1000);
        }

        function showResult(success, finalLevel) {
            if (success) {
                streak++;
                playSound('win');

                if (streak >= 3) {
                    modalIconContainer.className = "w-16 h-16 rounded-full flex items-center justify-center mb-3 bg-amber-500/20 text-amber-400 border border-amber-500/40 shadow-lg shadow-amber-500/20";
                    modalIconContainer.innerHTML = `<i data-lucide="trophy" class="w-8 h-8"></i>`;
                    modalTitle.innerText = "Success!";
                    modalTitle.className = "font-display text-2xl font-bold mb-2 text-amber-400";
                    modalDesc.innerHTML = `<span class="text-base font-semibold block mb-1">3-Level Streak Achieved!</span>Please enter code: <strong class="text-xl text-amber-300 font-mono tracking-wider block mt-1">9940</strong>`;
                    modalNextBtn.classList.add('hidden');
                } else {
                    modalIconContainer.className = "w-16 h-16 rounded-full flex items-center justify-center mb-3 bg-emerald-500/20 text-emerald-400 border border-emerald-500/40 shadow-lg shadow-emerald-500/20";
                    modalIconContainer.innerHTML = `<i data-lucide="party-popper" class="w-8 h-8"></i>`;
                    modalTitle.innerText = "Target Reached!";
                    modalTitle.className = "font-display text-xl font-bold mb-1 text-emerald-400";
                    modalDesc.innerText = `Perfect! You drained ${selectedDrain} unit(s) and hit level ${targetWater} exactly!`;
                    modalNextBtn.classList.remove('hidden');
                    modalNextBtn.className = "w-full py-3.5 rounded-2xl bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-400 hover:to-teal-500 font-display text-sm font-bold text-white shadow-lg shadow-emerald-500/20 transition active:scale-95 flex items-center justify-center gap-2";
                }
            } else {
                streak = 0;
                playSound('lose');

                modalIconContainer.className = "w-16 h-16 rounded-full flex items-center justify-center mb-3 bg-rose-500/20 text-rose-400 border border-rose-500/40 shadow-lg shadow-rose-500/20";
                modalIconContainer.innerHTML = `<i data-lucide="x-circle" class="w-8 h-8"></i>`;
                modalTitle.innerText = "Missed Goal!";
                modalTitle.className = "font-display text-xl font-bold mb-1 text-rose-400";
                modalDesc.innerText = `You drained ${selectedDrain} unit(s), ending at water level ${finalLevel}. Goal was ${targetWater}.`;
                modalNextBtn.classList.remove('hidden');
                modalNextBtn.className = "w-full py-3.5 rounded-2xl bg-gradient-to-r from-rose-500 to-pink-600 hover:from-rose-400 hover:to-pink-500 font-display text-sm font-bold text-white shadow-lg shadow-rose-500/20 transition active:scale-95 flex items-center justify-center gap-2";
            }

            streakVal.innerText = streak;

            lucide.createIcons();
            resultModal.classList.remove('opacity-0', 'pointer-events-none');
            modalCard.classList.remove('scale-90');
            modalCard.classList.add('scale-100');
        }

        function closeModal() {
            resultModal.classList.add('opacity-0', 'pointer-events-none');
            modalCard.classList.remove('scale-100');
            modalCard.classList.add('scale-90');
            newGame();
        }

        decBtn.addEventListener('click', () => adjustDrainAmount(-1));
        incBtn.addEventListener('click', () => adjustDrainAmount(1));

        drainBtn.addEventListener('click', drainWater);
        svgValveHandle.addEventListener('click', drainWater);
        modalNextBtn.addEventListener('click', closeModal);

        audioToggle.addEventListener('click', () => {
            audioEnabled = !audioEnabled;
            audioIcon.setAttribute('data-lucide', audioEnabled ? 'volume-2' : 'volume-x');
            lucide.createIcons();
        });

        document.addEventListener('keydown', (e) => {
            if (resultModal.classList.contains('opacity-0')) {
                if (e.key === 'ArrowUp' || e.key === 'ArrowRight') {
                    adjustDrainAmount(1);
                } else if (e.key === 'ArrowDown' || e.key === 'ArrowLeft') {
                    adjustDrainAmount(-1);
                } else if (e.key === 'Enter') {
                    drainWater();
                }
            } else if (e.key === 'Enter') {
                closeModal();
            }
        });

        window.onload = function() {
            initSvgScale();
            newGame();
            lucide.createIcons();
        };
    </script>
</body>
</html>
